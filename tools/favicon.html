<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#222;display:flex;gap:40px;padding:40px}
 .f{width:512px;height:512px;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:430px;line-height:1;position:relative;overflow:hidden}
 .a{background:#0D0410;color:#FF1F3D}
 .b{background:#FF1F3D;color:#fff}
 .c{background:#0D0410;color:#F2E9F7}
 .c::after{content:'';position:absolute;left:80px;right:80px;bottom:70px;height:22px;background:#FF1F3D}
 .a::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 6px,rgba(13,4,16,.45) 6px 8px)}
 span{transform:translateY(12px);display:block}
</style></head><body><!-- Kilde til favicon. Kandidat c er den som brukes. Rendres i 512x512, se VEDLIKEHOLD.md -->
 <div class="f a" id="a"><span>N</span></div>
 <div class="f b" id="b"><span>N</span></div>
 <div class="f c" id="c"><span>N</span></div>
</body></html>
