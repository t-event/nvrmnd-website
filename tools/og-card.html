<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(ellipse 50% 60% at 82% 40%, rgba(123,44,191,.55), transparent 70%),
      radial-gradient(ellipse 45% 55% at 12% 80%, rgba(196,0,26,.45), transparent 70%),
      #0D0410;
    display:flex;align-items:center;gap:64px;padding:0 80px;
    position:relative;
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(242,233,247,.09) 1px,transparent 1px),
      linear-gradient(90deg,rgba(242,233,247,.09) 1px,transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 20%,transparent 80%);
  }
  .scan{
    position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(13,4,16,.5) 3px 4px);
  }
  .art{
    position:relative;flex:0 0 auto;width:400px;height:400px;
    border:2px solid #FF1F3D;
    box-shadow:16px 16px 0 -2px rgba(34,214,232,.45), 0 30px 90px rgba(0,0,0,.6);
  }
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .cat{
    position:absolute;left:0;bottom:0;background:#FF1F3D;color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.22em;
    padding:9px 16px;
  }
  .txt{position:relative;flex:1;min-width:0}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.24em;
    text-transform:uppercase;color:#9E86AE;margin-bottom:22px;
    display:flex;align-items:center;gap:14px;
  }
  .tick{width:40px;height:3px;background:#FF1F3D;display:block}
  h1{
    font-family:'Anton',sans-serif;font-size:150px;line-height:.82;
    letter-spacing:-.02em;color:#F2E9F7;margin-bottom:26px;
  }
  .sub{
    font-family:'Anton',sans-serif;font-size:44px;line-height:1;
    letter-spacing:-.01em;color:#FF1F3D;text-transform:uppercase;
  }
  .sub span{color:#F2E9F7}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="art">
    <img src="../assets/need-me.jpg">
    <div class="cat">NVR001</div>
  </div>
  <div class="txt">
    <div class="eyebrow"><span class="tick"></span> Hardstyle / Norway</div>
    <h1>NVRMND</h1>
    <div class="sub"><span>Need Me</span> &nbsp;/&nbsp; Out now</div>
  </div>
  <div class="scan"></div>
</body>
</html>
